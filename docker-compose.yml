name: ek-erp

networks:
  ek-net:
    driver: bridge

volumes:
  ek-pg-data:
  ek-redis-data:
  ek-rabbit-data:
  ek-registry-data:

services:

  # =========================================================
  # SERVICE REGISTRY (PUBLIC)
  # =========================================================
  ek-registry:
    image: hashicorp/consul:latest
    container_name: ek-registry
    command: ["agent", "-server", "-bootstrap-expect=1", "-ui", "-client=0.0.0.0"]
    env_file: .env
    volumes:
      - ek-registry-data:/consul/data
    ports:
      - "${EK_CONSUL_PORT}:8500"
    networks:
      - ek-net

  # =========================================================
  # POSTGRES (PUBLIC)
  # =========================================================
  ek-postgres:
    image: postgres:16
    container_name: ek-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${EK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EK_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EK_POSTGRES_ROOT_DB}
    volumes:
      - ek-pg-data:/var/lib/postgresql/data
    ports:
      - "${EK_POSTGRES_PORT}:5432"
    networks:
      - ek-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EK_POSTGRES_USER} -d ${EK_POSTGRES_ROOT_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================================
  # AUTO DB CREATION
  # =========================================================
  ek-db-init:
    image: postgres:16
    container_name: ek-db-init
    env_file: .env
    depends_on:
      ek-postgres:
        condition: service_healthy
    networks:
      - ek-net
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        export PGPASSWORD="${EK_POSTGRES_PASSWORD}"

        for db in ${EK_SERVICE_DATABASES}; do
          echo "Ensuring database exists: $$db"

          DB_EXISTS=$(psql -h ek-postgres -U "${EK_POSTGRES_USER}" -d "${EK_POSTGRES_ROOT_DB}" \
            -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")

          if [ "$$DB_EXISTS" != "1" ]; then
            echo "Creating database: $$db"
            psql -h ek-postgres -U "${EK_POSTGRES_USER}" -d "${EK_POSTGRES_ROOT_DB}" \
              -c "CREATE DATABASE \"$$db\" OWNER \"${EK_POSTGRES_USER}\";"
          fi
        done

        echo "Database initialization complete."

  # =========================================================
  # REDIS (PUBLIC)
  # =========================================================
  ek-redis:
    image: redis:7-alpine
    container_name: ek-redis
    env_file: .env
    command: ["redis-server", "--requirepass", "${EK_REDIS_PASSWORD}"]
    volumes:
      - ek-redis-data:/data
    ports:
      - "${EK_REDIS_PORT}:6379"
    networks:
      - ek-net

  # =========================================================
  # EVENT BUS (PUBLIC)
  # =========================================================
  ek-event-bus:
    image: rabbitmq:3-management
    container_name: ek-event-bus
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${EK_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${EK_RABBITMQ_PASSWORD}
    volumes:
      - ek-rabbit-data:/var/lib/rabbitmq
    ports:
      - "${EK_RABBITMQ_PORT}:5672"
      - "${EK_RABBITMQ_MGMT_PORT}:15672"
    networks:
      - ek-net

  # =========================================================
  # CORE SERVICE (PUBLIC ENTRY POINT)
  # =========================================================
  ek-core:
    build:
      context: ./ek-core
    container_name: ek-core
    env_file: .env
    environment:
      CONSUL_HTTP_ADDR: http://ek-registry:8500
      SERVICE_NAME: ek-core
      SERVICE_ID: ek-core
      SERVICE_PORT: 80
      SERVICE_ADDRESS: ek-core
      SERVICE_HEALTH_PATH: /health

      REDIS_URL: redis://:${EK_REDIS_PASSWORD}@ek-redis:6379
      EVENT_BUS_URL: amqp://${EK_RABBITMQ_USER}:${EK_RABBITMQ_PASSWORD}@ek-event-bus:5672/
      DB_HOST: ek-postgres
      DB_PORT: 5432
      DB_DATABASE: ek_core_db
      DB_USERNAME: ${EK_POSTGRES_USER}
      DB_PASSWORD: ${EK_POSTGRES_PASSWORD}
    volumes:
      - ./ek-core/src:/var/www/html
    depends_on:
      ek-registry:
        condition: service_started
      ek-db-init:
        condition: service_completed_successfully
    ports:
      - "${EK_CORE_PORT}:80"
    networks:
      - ek-net

  # =========================================================
  # INTERNAL BUSINESS SERVICES (HEADLESS)
