name: ek-erp-platform

networks:
  ek-net:
    driver: bridge

volumes:
  ek-pg-data:
  ek-redis-data:
  ek-rabbit-data:
  ek-service-registry-data:

services:
  # =========================================================
  # SERVICE REGISTRY (PUBLIC)
  # =========================================================
  ek-service-registry:
    image: hashicorp/consul:1.17
    container_name: ek-service-registry
    command: ["agent", "-server", "-bootstrap-expect=1", "-ui", "-client=0.0.0.0"]
    env_file: .env
    volumes:
      - ek-service-registry-data:/consul/data
    ports:
      - "${EK_CONSUL_PORT}:8500"
    networks: [ek-net]

  # =========================================================
  # DATABASE (PUBLIC)
  # =========================================================
  ek-postgres:
    image: postgres:16
    container_name: ek-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${EK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EK_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EK_POSTGRES_ROOT_DB}
    volumes:
      - ek-pg-data:/var/lib/postgresql/data
    ports:
      - "${EK_POSTGRES_PORT}:5432"
    networks: [ek-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EK_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================================
  # REDIS (PUBLIC) - password protected
  # =========================================================
  ek-redis:
    image: redis:7-alpine
    container_name: ek-redis
    env_file: .env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${EK_REDIS_PASSWORD}"]
    volumes:
      - ek-redis-data:/data
    ports:
      - "${EK_REDIS_PORT}:6379"
    networks: [ek-net]

  # =========================================================
  # EVENT BUS (PUBLIC)
  # =========================================================
  ek-event-bus:
    image: rabbitmq:3-management
    container_name: ek-event-bus
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${EK_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${EK_RABBITMQ_PASSWORD}
    volumes:
      - ek-rabbit-data:/var/lib/rabbitmq
    ports:
      - "${EK_RABBITMQ_PORT}:5672"
      - "${EK_RABBITMQ_MGMT_PORT}:15672"
    networks: [ek-net]

  # =========================================================
  # CORE SERVICE (PUBLIC BUSINESS ENTRY POINT + frontend host)
  # =========================================================
  ek-core-service:
    image: your-registry/ek-core-service:latest
    container_name: ek-core-service
    env_file: .env
    environment:
      APP_ENV: local
      PORT: 8080

      CONSUL_HTTP_ADDR: http://ek-service-registry:8500

      REDIS_URL: redis://:${EK_REDIS_PASSWORD}@ek-redis:6379
      EVENT_BUS_URL: amqp://${EK_RABBITMQ_USER}:${EK_RABBITMQ_PASSWORD}@ek-event-bus:5672/

      DB_CONNECTION: pgsql
      DB_HOST: ek-postgres
      DB_PORT: 5432
      DB_DATABASE: ek_core_db
      DB_USERNAME: ${EK_POSTGRES_USER}
      DB_PASSWORD: ${EK_POSTGRES_PASSWORD}

      # Downstream services (internal only)
      AUTH_SERVICE_URL: http://ek-auth-service:8000
      CONFIG_SERVICE_URL: http://ek-config-service:8000
      WORKFLOW_SERVICE_URL: http://ek-workflow-service:8000
      STAKEHOLDERS_SERVICE_URL: http://ek-stakeholders-service:8000
      CATALOG_SERVICE_URL: http://ek-catalog-service:8000
      INVENTORY_SERVICE_URL: http://ek-inventory-service:8000
      PROCUREMENT_SERVICE_URL: http://ek-procurement-service:8000
      SALES_SERVICE_URL: http://ek-sales-service:8000
      PRODUCTION_SERVICE_URL: http://ek-production-service:8000
      LOGISTICS_SERVICE_URL: http://ek-logistics-service:8000
      BILLING_SERVICE_URL: http://ek-billing-service:8000
      ACCOUNTS_SERVICE_URL: http://ek-accounts-service:8000
      REPORTING_SERVICE_URL: http://ek-reporting-service:8000
      PROJECTS_SERVICE_URL: http://ek-projects-service:8000
      HR_SERVICE_URL: http://ek-hr-service:8000
      ASSETS_SERVICE_URL: http://ek-assets-service:8000

    depends_on:
      ek-db-init:
        condition: service_completed_successfully
      ek-service-registry:
        condition: service_started
      ek-redis:
        condition: service_started
      ek-event-bus:
        condition: service_started

    ports:
      - "${EK_CORE_PORT}:8080"
    networks: [ek-net]

  # =========================================================
  # INTERNAL BUSINESS SERVICES (HEADLESS - no published ports)
  # =========================================================

  ek-auth-service:
    image: your-registry/ek-auth-service:latest
    container_name: ek-auth-service
    env_file: .env
    environment:
      PORT: 8000
      CONSUL_HTTP_ADDR: http://ek-service-registry:8500
      EVENT_BUS_URL: amqp://${EK_RABBITMQ_USER}:${EK_RABBITMQ_PASSWORD}@ek-event-bus:5672/
      REDIS_URL: redis://:${EK_REDIS_PASSWORD}@ek-redis:6379
      DB_HOST: ek-postgres
      DB_PORT: 5432
      DB_DATABASE: ek_auth_db
      DB_USERNAME: ${EK_POSTGRES_USER}
      DB_PASSWORD: ${EK_POSTGRES_PASSWORD}
    depends_on:
      ek-db-init:
        condition: service_completed_successfully
    networks: [ek-net]

  ek-config-service:
    image: your-registry/ek-config-service:latest
    container_name: ek-config-service
    env_file: .env
    environment:
      PORT: 8000
      CONSUL_HTTP_ADDR: http://ek-service-registry:8500
      DB_HOST: ek-postgres
      DB_PORT: 5432
      DB_DATABASE: ek_config_db
      DB_USERNAME: ${EK_POSTGRES_USER}
      DB_PASSWORD: ${EK_POSTGRES_PASSWORD}
    depends_on:
      ek-db-init:
